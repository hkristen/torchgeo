model:
  class_path: torchgeo.trainers.SemanticSegmentationTask
  init_args:
    model: 'unet'
    backbone: 'resnet18'
    in_channels: 3
    task: 'multiclass'
    num_classes: 24
    loss: 'ce'
    ignore_index: 0
data:
  class_path: torchgeo.datamodules.HabitAlp2DataModule
  init_args:
    batch_size: 2
    patch_size: 32
    length: 10
    task: 'segmentation'
  dict_kwargs:
    root: '/home/hkristen/torchgeo/data/habitalp2'
    year: !!str 2013
    bands: ['R', 'G', 'B']
